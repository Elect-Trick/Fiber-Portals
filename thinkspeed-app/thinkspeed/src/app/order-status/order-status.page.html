<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
        <ion-col sizeXs="8.5" sizeMd="6" offsetMd="3.5">
          <img
          class="heading-img"
          src="https://assets-global.website-files.com/5d6513339093d78653c57dc3/5d6525f9437276d13240998e_CA_Logo.png"
        />
        </ion-col>

      </ion-buttons>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-grid>
    <ion-card>
      <ion-card-header class="form-toolbar">
        <ion-toolbar>
          <ion-title>Order Lookup</ion-title>
        </ion-toolbar>
      </ion-card-header>
      <ion-grid>
        <ion-row> </ion-row>
        <ion-row>
          <ion-col sizeXs="12" sizeMd="5" offsetMd="3.5">
            <ion-item lines="none">
              <ion-searchbar
                type="text"
                (ionChange)="search($event)"
                placeholder="eg.CAS20221230-000001"
                (ionClear)="clearSearch($event)"
                animated="true"
                show-clear-button="focus"
                value=""
              ></ion-searchbar>
            </ion-item>
          </ion-col>
        </ion-row>
      </ion-grid>

      <ion-card-content>
        <ion-card>
          <ion-card-header class="form-toolbar">
            <ion-toolbar>
              <ion-row>
                <ion-col sizeMd="1"> </ion-col>
                <ion-col sizeMd="3" sizeXs="12"> Order Number</ion-col>
                <ion-col sizeMd="3"> Order Status </ion-col>
                <ion-col sizeMd="3"> Product </ion-col>
                <ion-col sizeMd="2"> Creation Date </ion-col>
              </ion-row></ion-toolbar
            >
          </ion-card-header>
          <ion-card-content>
            <ion-row
              (click)="viewOrder(order)"
              class="user-item"
              *ngFor="let order of orders"
            >
              <ion-col sizeXs="12" sizeMd="1">
                <ion-item lines="none">
                  <ion-icon slot="start" name="person-circle"></ion-icon>
                </ion-item>
              </ion-col>
              <ion-col sizeXs="12" sizeMd="3">
                <ion-item lines="none">
                  <ion-label>{{order.order_number}}</ion-label>
                </ion-item>
              </ion-col>
              <ion-col sizeXs="12" sizeMd="3">
                <ion-item lines="none">
                  <ion-label
                    >{{fetchOrderStatus(order.order_status)}}</ion-label
                  >
                </ion-item>
              </ion-col>
              <ion-col sizeXs="12" sizeMd="3">
                <ion-item lines="none">
                  <ion-label>{{fetchProducts(order.product)}}</ion-label>
                </ion-item>
              </ion-col>
              <ion-col sizeXs="12" sizeMd="2">
                <ion-item lines="none">
                  <ion-label>{{order.creation_date}}</ion-label>
                </ion-item>
              </ion-col>
            </ion-row>
          </ion-card-content>
        </ion-card>
      </ion-card-content>
    </ion-card>
  </ion-grid>
    <!-- <img [src]="image" /> -->
  <img *ngIf="!orderSelected" class="search-image"
   src="../../assets/image/curious-analyst-investigating-question-mark-with-magnifier/Curious analyst investigating question mark with magnifier.jpg" >

  <!-- <ion-row *ngIf="!orderSelected">
    <ion-col sizeMd="12">
      <img
        class="search-image"
        src="../../assets/image/curious-analyst-investigating-question-mark-with-magnifier/Curious analyst investigating question mark with magnifier.jpg"
        alt=""
      />
    </ion-col>
  </ion-row> -->
  <ion-card *ngIf="orderSelected">
    <ion-card-header class="form-toolbar">
      <ion-toolbar>
        <ion-row>
          <ion-col sizeXs="12" sizeMd="8">
            <ion-title>Order- {{selectedOrder.order_number}}</ion-title>
          </ion-col>
          <ion-col sizeXs="12" sizeMd="2">
            <ion-button
            [disabled]="!rejectable"
              (click)="rejectOrder(selectedOrder)"
              expand="block"
            color="danger"
              shape="square"
              class="reject-order-btn"
            >
            <ion-icon name="close-outline"></ion-icon>
              Reject Order
            </ion-button>
          </ion-col>
        </ion-row>
      </ion-toolbar>
    </ion-card-header>
    <ion-card-content>
      <app-view-order [order]="selectedOrder"></app-view-order>
    </ion-card-content>
  </ion-card>
</ion-content>
<ion-footer *ngIf="!orderSelected">
  <h6 class="footer">
    <a
      href="https://www.freepik.com/free-vector/curious-analyst-investigating-question-mark-with-magnifier_19212782.htm#query=search&position=7&from_view=keyword"
      >Image by pch.vector</a
    >
    on Freepik
  </h6>
</ion-footer>

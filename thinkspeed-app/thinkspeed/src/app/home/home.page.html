<ion-content>
  <ion-grid class="custom-padding">
    <ion-row>
      <ion-col sizeMd="4" size-xs="0"> </ion-col>
      <ion-col sizeMd="4" size-xs="12">
        <ion-card>
          <ion-card-header>
            <ion-toolbar class="form-toolbar">
                <img
                class="logo"
                src="https://assets-global.website-files.com/5d6513339093d78653c57dc3/5d6525f9437276d13240998e_CA_Logo.png"
                alt=""
              />

            </ion-toolbar>
          </ion-card-header>
          <ion-card-content>
            <form
              action="post"
              [formGroup]="loginGroup"
              (ngSubmit)="login()"
              #form="ngForm"
            >
              <ion-grid>
                <ion-row>
                  <ion-col size="12">
                    <ion-list>
                      <ion-item class="form-control">
                        <ion-label position="floating">E-mail</ion-label>

                        <ion-input
                          formControlName="email"
                          placeholder="E-mail"
                          inputmode="email"
                          autocomplete="on"
                        ></ion-input>
                      </ion-item>
                      <ion-label class="error-labels" *ngIf="loginGroup.controls['email'].touched &&!loginGroup.controls['email'].valid"
                        >Required</ion-label
                      >

                      <ion-item class="form-control">
                        <ion-label position="floating">Password</ion-label>
                        <ion-input
                          formControlName="password"
                          type="text"
                          placeholder="Password"
                        ></ion-input>
                      </ion-item>
                      <ion-label
                      class="error-labels"
                        *ngIf="loginGroup.controls['password'].touched && !loginGroup.controls['password'].valid"
                        >Required</ion-label
                      >
                    </ion-list>
                    <ion-item class="button-area" lines="none">
                      <ion-col  size-xs="6">
                        <ion-button type="submit" fill="solid" shape="square">
                          Login
                        </ion-button>
                      </ion-col>
                      <ion-col  size-xs="6">
                        <ion-label>Forgot Password?</ion-label>
                      </ion-col>
                    </ion-item>
                  </ion-col>
                </ion-row>
              </ion-grid>
            </form>
          </ion-card-content>
        </ion-card>
      </ion-col>
      <ion-col sizeMd="4" size-xs="0"></ion-col>
    </ion-row>
  </ion-grid>
</ion-content>

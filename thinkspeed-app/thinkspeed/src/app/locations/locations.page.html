<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
        <ion-col sizeXs="8.5" sizeMd="6" offsetMd="3.5">
          <img
            class="heading-img"
            src="https://assets-global.website-files.com/5d6513339093d78653c57dc3/5d6525f9437276d13240998e_CA_Logo.png"
          />
        </ion-col>
      </ion-buttons>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-header class="form-toolbar">
      <ion-toolbar>
        <ion-title>Manage Locations</ion-title>
      </ion-toolbar>
    </ion-card-header>
    <ion-card-content>
      <ion-grid>
        <ion-row>
          <ion-col size="12">
            <ion-segment value="pizza" (ionChange)="segmentChanged($event)">
              <ion-segment-button value="pizza">
                <ion-label>MDU / ESTATE</ion-label>
              </ion-segment-button>
              <ion-segment-button value="pasta">
                <ion-label>SDU</ion-label>
              </ion-segment-button>
            </ion-segment>
          </ion-col>
          <ion-col size="12">
            <ion-searchbar
              placeholder="Search for Complex"
              show-clear-button="focus"
              (ionChange)="onSearchChange($event)"
              [debounce]="250"
            ></ion-searchbar>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col size="12">
            <ion-card>
              <ion-card-header class="form-toolbar">
                <ion-toolbar>
                  <ion-grid>
                    <ion-row>
                      <ion-col size="1"></ion-col>
                      <ion-col size="3">Building Name</ion-col>
                      <ion-col size="3">Surburb</ion-col>
                      <!-- <ion-col size="2.5">Date Logged</ion-col>
                      <ion-col size="2.5"> Assigned To</ion-col> -->
                    </ion-row>
                  </ion-grid>
                </ion-toolbar>
              </ion-card-header>
              <ion-card-content>
                <ion-row>
                  <ion-col size="12">
                    <ion-list>
                      <ion-grid>
                        <ion-accordion-group
                          animated="false"
                          (ionChange)="selectLocation($event)"
                        >
                          <ion-accordion
                            (click)="$event.stopPropagation()"
                            class="building-row"
                            #mine
                            *ngFor="let index;let location of locations"
                            [value]="location.complex_name"
                          >
                            <ion-item class="complex-list" slot="header">
                              <ion-col size="1">
                                <ion-item class="item-icon" lines="none">
                                  <ion-icon
                                    slot="start"
                                    name="business-outline"
                                  ></ion-icon
                                ></ion-item>
                              </ion-col>
                              <ion-col size="3">
                                <ion-label>{{location.complex_name}}</ion-label>
                              </ion-col>
                              <ion-col size="3">
                                <ion-label
                                  >{{location.units[0].surburb}}</ion-label
                                >
                              </ion-col>
                            </ion-item>
                            <div slot="content">
                              <ion-row>
                                <ion-col size="12">
                                  <ion-row>
                                    <ion-col size="3">
                                      <ion-searchbar
                                        placeholder="eg. Search for unit number"
                                        color="medium"
                                        (ionChange)="unitSearch($event);$event.stopPropagation()"
                                        [debounce]="250"
                                      ></ion-searchbar>
                                    </ion-col>
                                  </ion-row>
                                  <ion-card class="unit-list">
                                    <ion-card-content>
                                      <ion-col size="12">
                                        <ion-accordion-group
                                          #second
                                          (ionChange)="$event.stopPropagation()"
                                        >
                                          <ion-accordion
                                            [value]="unit.unit_id"
                                            *ngFor="let unit of location.units"
                                            value="first"
                                          >
                                            <ion-item
                                              slot="header"
                                              class="list-item"
                                            >
                                              <ion-grid fixed>
                                                <ion-row>
                                                  <ion-col size="4" offset="1">
                                                    <ion-item
                                                      lines="none"
                                                      class="accord-header"
                                                    >
                                                      <ion-icon
                                                        slot="start"
                                                        name="location"
                                                      ></ion-icon>
                                                      <ion-label>
                                                        {{unit.unit}}
                                                        {{unit.complex_name}}</ion-label
                                                      >
                                                    </ion-item>
                                                  </ion-col>
                                                </ion-row>
                                              </ion-grid>
                                            </ion-item>
                                            <div
                                              class="ion-padding"
                                              slot="content"
                                            >
                                              <ion-card
                                                color="medium"
                                                class="unit-details"
                                              >
                                                <ion-card-header>
                                                  <ion-card-title
                                                    >Viewing Unit
                                                    {{unit.unit}}</ion-card-title
                                                  >
                                                </ion-card-header>
                                                <ion-card-content>
                                                  <ion-row>
                                                    <ion-col
                                                      offset="1"
                                                      size="2"
                                                    >
                                                      <ion-item>
                                                        <ion-label
                                                          >FSAN</ion-label
                                                        >
                                                      </ion-item>
                                                    </ion-col>
                                                    <ion-col size="3">
                                                      <ion-item>
                                                        <ion-label
                                                          >{{unit.fsan}}</ion-label
                                                        >
                                                      </ion-item>
                                                    </ion-col>
                                                  </ion-row>
                                                  <ion-row>
                                                    <ion-col
                                                      offset="1"
                                                      size="2"
                                                    >
                                                      <ion-item>
                                                        <ion-label
                                                          >Active
                                                          Service</ion-label
                                                        >
                                                      </ion-item>
                                                    </ion-col>
                                                    <ion-col size="3">
                                                      <ion-item>
                                                        <ion-label
                                                          >{{serviceStatus(unit.active_service)}}</ion-label
                                                        >
                                                      </ion-item>
                                                    </ion-col>
                                                  </ion-row>
                                                  <ion-row>
                                                    <ion-col
                                                      size="2"
                                                      offset="1"
                                                    >
                                                      <ion-button
                                                        expand="block"
                                                        fill="full"
                                                        shape="square"
                                                        class="log-ticket-btn"
                                                      >
                                                        LOG TICKET
                                                      </ion-button>
                                                    </ion-col>
                                                    <ion-col size="2">
                                                      <ion-button
                                                        expand="block"
                                                        fill="full"
                                                        shape="square"
                                                      >
                                                        EDIT FSAN
                                                      </ion-button>
                                                    </ion-col>
                                                  </ion-row>
                                                </ion-card-content>
                                              </ion-card>
                                            </div>
                                          </ion-accordion>
                                        </ion-accordion-group>
                                      </ion-col>
                                    </ion-card-content>
                                  </ion-card>
                                </ion-col>
                              </ion-row>
                              <!-- <ion-footer>
                                    <ion-toolbar color="#FFF">
                                      <ion-card-subtitle
                                        >Units for
                                        {{location.complex_name}}</ion-card-subtitle
                                      >
                                    </ion-toolbar>
                                  </ion-footer> -->
                            </div>
                          </ion-accordion>
                        </ion-accordion-group>
                        <!-- <ion-row
                          *ngFor="let index;let outage of outages"
                          (click)="selectOutage(outage)"
                          class="list-item"
                        >

                        </ion-row> -->
                      </ion-grid>
                    </ion-list>
                  </ion-col>
                </ion-row>
              </ion-card-content>
            </ion-card>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card-content>
  </ion-card>
</ion-content>

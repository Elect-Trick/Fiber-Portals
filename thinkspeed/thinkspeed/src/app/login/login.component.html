<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <script
      src="https://use.fontawesome.com/releases/v6.1.0/js/all.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body class="bg-primary">
    <div id="layoutAuthentication">
      <div id="layoutAuthentication_content">
        <!-- <div *ngIf="loggedIn" class="spinner spinner-grow " role="status">
        </div> -->
        <main>
          <div class="container">
            <div class="row justify-content-center">
              <div class="col-lg-5">
                <div class="card shadow-lg border-0 rounded-lg mt-5">
                  <div class="card-header">
                    <div class="logo">
                      <img
                        src="https://thinkspeed.co.za/wp-content/uploads/2022/05/TSLogoReg.png"
                        alt=""
                        srcset=""
                      />
                    </div>
                  </div>
                  <div class="card-body">
                    <form [formGroup]="loginGroup" (ngSubmit)="login(form)" #form="ngForm">
                      <div class="form-floating mb-3">
                        <input
                          class="form-control input-text"
                          id="inputEmail"
                          type="email"
                          placeholder="name@example.com"
                          name='email'
                          formControlName="email"
                        />
                        <label for="inputEmail">Email address</label>
                        <p class="alert warning-text" *ngIf="(!loginGroup.controls['email'].valid && loginGroup.controls['email'].touched )">Please enter a Valid email</p>
                        <p *ngIf=""></p>

                      </div>
                      <div class="form-floating mb-3">
                        <input
                          class="form-control"
                          id="inputPassword"
                          type="password"
                          placeholder="Password"
                          formControlName = 'password'

                        />
                        <label for="inputPassword">Password</label>
                        <p class="alert warning-text" *ngIf="loginGroup.controls['password'].errors?.['minlength'] && loginGroup.controls['password'].dirty">Password must be at least 5 characters</p>
                        <p class="alert warning-text" *ngIf="(loginGroup.controls['password'].errors?.['required'] && loginGroup.controls['password'].touched)"> Password is required</p>
                        <!-- <p class="alert warning-text" *ngIf="(loginGroup.controls['password'].errors?.['minLength'])"> Password must be at least 5 characters</p> -->
                        <!-- <p class="alert warning-text" *ngIf="(!loginGroup.controls['password'].valid && loginGroup.controls['password'].dirty )">Please enter a Valid email</p> -->

                      </div>
                      <div class="form-check mb-3">
                        <input
                          class="form-check-input"
                          id="inputRememberPassword"
                          type="checkbox"
                          value=""
                        />
                        <label
                          class="form-check-label"
                          for="inputRememberPassword"
                          >Remember Password</label
                        >
                      </div>
                      <div
                        class="d-flex align-items-center justify-content-between mt-4 mb-0"
                      >
                        <a class="small" href="password.html"
                          >Forgot Password?</a
                        >
                        <button [disabled]="!loginGroup.valid" class="btn btn-primary" type="submit" >Login</button>
                        <!-- <button type="submit">Submit</button> -->
                      </div>
                    </form>
                  </div>
                  <!-- <div class="card-footer text-center py-3">
                                        <div class="small"><a href="register.html">Need an account? Sign up!</a></div>
                                    </div> -->
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
      <!-- <div id="layoutAuthentication_footer">
        <footer class="py-4 bg-light mt-auto">
          <div class="container-fluid px-4">
            <div
              class="d-flex align-items-center justify-content-between small"
            >
              <div class="text-muted">Copyright &copy; Your Website 2022</div>
              <div>
                <a href="#">Privacy Policy</a>
                &middot;
                <a href="#">Terms &amp; Conditions</a>
              </div>
            </div>
          </div>
        </footer>
      </div> -->
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
    <script src="js/scripts.js"></script>
  </body>
</html>
